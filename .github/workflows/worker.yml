name: Deploy nugs relay (Cloudflare Worker)

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: worker
      - uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: '4.166.0'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
      # Hand the Anthropic key (for weekly picks) to Cloudflare as a secret.
      # Skipped until the ANTHROPIC_API_KEY repo secret exists.
      - name: Set Anthropic API key
        if: env.ANTHROPIC_KEY != ''
        working-directory: worker
        run: printf '%s' "$ANTHROPIC_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
